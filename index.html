<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پنل مدیریت سریال‌ها</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700&display=swap');
        body { font-family: 'Vazirmatn', sans-serif; background-color: #0f172a; color: #f8fafc; }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8">

    <!-- Header -->
    <header class="flex justify-between items-center mb-8 bg-slate-800/50 p-4 rounded-2xl border border-slate-700/50 backdrop-blur">
        <h1 class="text-xl md:text-2xl font-bold text-indigo-400"><i class="fa-solid fa-film ml-2"></i>مدیریت سریال‌ها</h1>
        <button onclick="openSerialModal()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-xl flex items-center gap-2 transition shadow-lg shadow-indigo-600/20">
            <i class="fa-solid fa-plus"></i> افزودن سریال
        </button>
    </header>

    <!-- Main Container -->
    <main>
        <!-- Serial List View -->
        <div id="serial-section">
            <h2 class="text-lg font-semibold mb-4 text-slate-300">لیست سریال‌ها</h2>
            <div id="serials-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
                <!-- Serials injected dynamically -->
            </div>
        </div>

        <!-- Episodes View (Hidden by default) -->
        <div id="episode-section" class="hidden">
            <button onclick="backToSerials()" class="mb-6 bg-slate-700 hover:bg-slate-600 text-white px-4 py-2 rounded-xl flex items-center gap-2 transition">
                <i class="fa-solid fa-arrow-right"></i> بازگشت به سریال‌ها
            </button>
            <div class="flex justify-between items-center mb-6 bg-slate-800/80 p-4 rounded-xl border border-slate-700">
                <div class="flex items-center gap-4">
                    <img id="current-serial-img" src="" class="w-16 h-20 object-cover rounded-lg shadow" alt="">
                    <div>
                        <h2 id="current-serial-title" class="text-xl font-bold"></h2>
                        <p id="current-serial-genres" class="text-sm text-slate-400 mt-1"></p>
                    </div>
                </div>
                <button onclick="openEpisodeModal()" class="bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-2 rounded-xl flex items-center gap-2 transition shadow-lg shadow-emerald-600/20">
                    <i class="fa-solid fa-plus"></i> افزودن قسمت
                </button>
            </div>
            
            <div id="episodes-list" class="space-y-4">
                <!-- Episodes injected dynamically -->
            </div>
        </div>
    </main>

    <!-- Serial Modal -->
    <div id="serial-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
        <div class="bg-slate-900 border border-slate-800 w-full max-w-lg rounded-2xl p-6 shadow-2xl relative max-h-[90vh] overflow-y-auto">
            <h3 id="serial-modal-title" class="text-lg font-bold mb-4 text-indigo-400">افزودن سریال جدید</h3>
            <form id="serial-form" onsubmit="handleSerialSubmit(event)" class="space-y-4">
                <input type="hidden" id="serial-id">
                <div>
                    <label class="block text-sm text-slate-400 mb-1">نام سریال</label>
                    <input type="text" id="serial-name" required class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 focus:outline-none focus:border-indigo-500">
                </div>
                <div>
                    <label class="block text-sm text-slate-400 mb-1">تعداد قسمت‌ها</label>
                    <input type="number" id="serial-ep-count" required class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 focus:outline-none focus:border-indigo-500">
                </div>
                <div>
                    <label class="block text-sm text-slate-400 mb-1">عکس سریال (فایل)</label>
                    <input type="file" id="serial-image" accept="image/*" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2 file:ml-4 file:py-1 file:px-3 file:rounded-lg file:border-0 file:text-sm file:bg-indigo-600 file:text-white hover:file:bg-indigo-500">
                </div>
                <div>
                    <label class="block text-sm text-slate-400 mb-1">ژانرها (هر تعداد که خواستید اضافه کنید)</label>
                    <div id="genres-container" class="space-y-2 mb-2"></div>
                    <button type="button" onclick="addGenreInput()" class="text-sm bg-slate-800 hover:bg-slate-700 text-indigo-400 px-3 py-1.5 rounded-lg border border-slate-700 transition">+ افزودن ژانر</button>
                </div>
                <div class="flex justify-end gap-3 mt-6">
                    <button type="button" onclick="closeSerialModal()" class="bg-slate-800 hover:bg-slate-700 px-4 py-2 rounded-xl transition">انصراف</button>
                    <button type="submit" id="serial-submit-btn" class="bg-indigo-600 hover:bg-indigo-500 px-6 py-2 rounded-xl transition">ذخیره</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Episode Modal -->
    <div id="episode-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
        <div class="bg-slate-900 border border-slate-800 w-full max-w-lg rounded-2xl p-6 shadow-2xl relative max-h-[90vh] overflow-y-auto">
            <h3 id="episode-modal-title" class="text-lg font-bold mb-4 text-emerald-400">افزودن قسمت جدید</h3>
            <form id="episode-form" onsubmit="handleEpisodeSubmit(event)" class="space-y-4">
                <input type="hidden" id="episode-id">
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm text-slate-400 mb-1">شماره قسمت</label>
                        <input type="number" id="ep-number" required class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 focus:outline-none focus:border-emerald-500">
                    </div>
                    <div>
                        <label class="block text-sm text-slate-400 mb-1">نام قسمت</label>
                        <input type="text" id="ep-name" required class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 focus:outline-none focus:border-emerald-500">
                    </div>
                </div>
                <div>
                    <label class="block text-sm text-slate-400 mb-1">عکس قسمت (فایل)</label>
                    <input type="file" id="ep-image" accept="image/*" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2 file:ml-4 file:py-1 file:px-3 file:rounded-lg file:border-0 file:text-sm file:bg-emerald-600 file:text-white hover:file:bg-emerald-500">
                </div>
                <div class="grid grid-cols-3 gap-2">
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">حجم 480p</label>
                        <input type="text" id="ep-size-480" placeholder="مثال: 300MB" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm">
                    </div>
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">حجم 720p</label>
                        <input type="text" id="ep-size-720" placeholder="مثال: 700MB" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm">
                    </div>
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">حجم 1080p</label>
                        <input type="text" id="ep-size-1080" placeholder="مثال: 1.5GB" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm">
                    </div>
                </div>
                <div>
                    <label class="block text-sm text-slate-400 mb-1">لینک دانلود</label>
                    <input type="url" id="ep-link" required placeholder="https://..." class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 focus:outline-none focus:border-emerald-500">
                </div>
                <div class="flex justify-end gap-3 mt-6">
                    <button type="button" onclick="closeEpisodeModal()" class="bg-slate-800 hover:bg-slate-700 px-4 py-2 rounded-xl transition">انصراف</button>
                    <button type="submit" id="episode-submit-btn" class="bg-emerald-600 hover:bg-emerald-500 px-6 py-2 rounded-xl transition">ذخیره</button>
                </div>
            </form>
        </div>
    </div>

    <!-- JavaScript Logic -->
    <script>
        let serialsData = {};
        let currentActiveSerialId = null;

        // تابع کمکی برای تبدیل فایل به Base64 جهت ارسال به API
        const fileToBase64 = file => new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = () => resolve(reader.result.split(',')[1]);
            reader.onerror = error => reject(error);
        });

        // آپلود عکس به ImgBB از طریق API ورسل
        async function uploadImageToImgBB(fileInputId) {
            const fileInput = document.getElementById(fileInputId);
            if (!fileInput.files || fileInput.files.length === 0) return null;
            
            const base64Image = await fileToBase64(fileInput.files[0]);
            const res = await fetch('/api/imgbb', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ image: base64Image })
            });
            const data = await res.json();
            if (data.success) {
                return data.data.url;
            } else {
                throw new Error('خطا در آپلود عکس');
            }
        }

        // بارگذاری سریال‌ها از فایربیس (از طریق api/firebase)
        async function fetchSerials() {
            try {
                const res = await fetch('/api/firebase?path=serials.json');
                serialsData = await res.json() || {};
                renderSerials();
            } catch (err) {
                console.error("خطا در دریافت اطلاعات:", err);
            }
        }

        // رندر کردن لیست سریال‌ها
        function renderSerials() {
            const grid = document.getElementById('serials-grid');
            grid.innerHTML = '';

            for (const id in serialsData) {
                const serial = serialsData[id];
                const genresText = serial.genres ? serial.genres.join(', ') : '';
                
                grid.innerHTML += `
                    <div class="bg-slate-800/60 border border-slate-700/60 rounded-2xl overflow-hidden shadow-lg flex flex-col justify-between group">
                        <div class="cursor-pointer" onclick="openSerialEpisodes('${id}')">
                            <img src="${serial.image}" class="w-full h-48 object-cover group-hover:scale-105 transition duration-300" alt="${serial.name}">
                            <div class="p-4">
                                <h3 class="font-bold text-lg mb-1 truncate">${serial.name}</h3>
                                <p class="text-xs text-indigo-400 mb-2">${genresText}</p>
                                <p class="text-xs text-slate-400">تعداد قسمت: ${serial.epCount}</p>
                            </div>
                        </div>
                        <div class="px-4 pb-4 flex justify-end gap-2 border-t border-slate-700/40 pt-3">
                            <button onclick="editSerial('${id}')" class="bg-slate-700 hover:bg-slate-600 p-2 rounded-xl text-amber-400 transition"><i class="fa-solid fa-pen"></i></button>
                            <button onclick="deleteSerial('${id}')" class="bg-slate-700 hover:bg-slate-600 p-2 rounded-xl text-rose-400 transition"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    </div>
                `;
            }
        }

        // مدیریت مودال سریال
        function openSerialModal(serialId = null) {
            document.getElementById('serial-modal').classList.remove('hidden');
            document.getElementById('serial-modal').classList.add('flex');
            document.getElementById('genres-container').innerHTML = '';
            
            if (serialId) {
                document.getElementById('serial-modal-title').innerText = 'ویرایش سریال';
                document.getElementById('serial-id').value = serialId;
                const s = serialsData[serialId];
                document.getElementById('serial-name').value = s.name;
                document.getElementById('serial-ep-count').value = s.epCount;
                if (s.genres) {
                    s.genres.forEach(g => addGenreInput(g));
                }
            } else {
                document.getElementById('serial-modal-title').innerText = 'افزودن سریال جدید';
                document.getElementById('serial-form').reset();
                document.getElementById('serial-id').value = '';
                addGenreInput();
            }
        }

        function closeSerialModal() {
            document.getElementById('serial-modal').classList.remove('flex');
            document.getElementById('serial-modal').classList.add('hidden');
        }

        function addGenreInput(val = '') {
            const container = document.getElementById('genres-container');
            const div = document.createElement('div');
            div.className = 'flex gap-2';
            div.innerHTML = `
                <input type="text" value="${val}" placeholder="نام ژانر" required class="genre-input flex-1 bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-indigo-500">
                <button type="button" onclick="this.parentElement.remove()" class="bg-rose-500/20 text-rose-400 px-3 rounded-xl hover:bg-rose-500/30 transition"><i class="fa-solid fa-xmark"></i></button>
            `;
            container.appendChild(div);
        }

        async function handleSerialSubmit(e) {
            e.preventDefault();
            const id = document.getElementById('serial-id').value;
            const name = document.getElementById('serial-name').value;
            const epCount = document.getElementById('serial-ep-count').value;
            
            const genreInputs = document.querySelectorAll('.genre-input');
            const genres = Array.from(genreInputs).map(input => input.value).filter(v => v.trim() !== '');

            const submitBtn = document.getElementById('serial-submit-btn');
            submitBtn.innerText = 'در حال پردازش...';
            submitBtn.disabled = true;

            try {
                let imageUrl = id ? serialsData[id].image : '';
                const fileInput = document.getElementById('serial-image');
                if (fileInput.files.length > 0) {
                    imageUrl = await UploadImageToImgBB('serial-image'); // اصلاح نام تابع
                }
                
                // اصلاح نام تابع در خط پایین:
                // چون نام تابع اصلی uploadImageToImgBB است:
                // imageUrl = await uploadImageToImgBB('serial-image');

                // جهت اطمینان از تابع صحیح استفاده می‌کنیم:
                if (fileInput.files.length > 0) {
                    imageUrl = await uploadImageToImgBB('serial-image');
                }

                const payload = { name, epCount, genres, image: imageUrl };
                const method = id ? 'PATCH' : 'POST';
                const endpoint = id ? `/api/firebase?path=serials/${id}.json` : `/api/firebase?path=serials.json`;

                await fetch(endpoint, {
                    method: method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                closeSerialModal();
                fetchSerials();
            } catch (err) {
                alert('خطا: ' + err.message);
            } finally {
                submitBtn.innerText = 'ذخیره';
                submitBtn.disabled = false;
            }
        }

        function editSerial(id) { openSerialModal(id); }

        async function deleteSerial(id) {
            if (confirm('آیا از حذف این سریال مطمئن هستید؟')) {
                await fetch(`/api/firebase?path=serials/${id}.json`, { method: 'DELETE' });
                fetchSerials();
            }
        }

        // بخش مدیریت قسمت‌ها (Episodes)
        function openSerialEpisodes(id) {
            currentActiveSerialId = id;
            const serial = serialsData[id];
            
            document.getElementById('serial-section').classList.add('hidden');
            document.getElementById('episode-section').classList.remove('hidden');
            
            document.getElementById('current-serial-img').src = serial.image;
            document.getElementById('current-serial-title').innerText = serial.name;
            document.getElementById('current-serial-genres').innerText = serial.genres ? serial.genres.join(', ') : '';

            renderEpisodes();
        }

        function backToSerials() {
            currentActiveSerialId = null;
            document.getElementById('episode-section').classList.add('hidden');
            document.getElementById('serial-section').classList.remove('hidden');
        }

        function renderEpisodes() {
            const listContainer = document.getElementById('episodes-list');
            listContainer.innerHTML = '';
            
            const serial = serialsData[currentActiveSerialId];
            const episodes = serial.episodes || {};

            for (const epKey in episodes) {
                const ep = episodes[epKey];
                listContainer.innerHTML += `
                    <div class="bg-slate-800/60 border border-slate-700/60 p-4 rounded-2xl flex flex-col md:flex-row items-center justify-between gap-4 shadow">
                        <div class="flex items-center gap-4 w-full md:w-auto">
                            <img src="${ep.image}" class="w-20 h-14 object-cover rounded-xl" alt="">
                            <div>
                                <h4 class="font-bold">قسمت ${ep.number}: ${ep.name}</h4>
                                <div class="flex gap-3 text-xs text-slate-400 mt-1">
                                    <span>480p: ${ep.sizes['480'] || '-'}</span>
                                    <span>720p: ${ep.sizes['720'] || '-'}</span>
                                    <span>1080p: ${ep.sizes['1080'] || '-'}</span>
                                </div>
                            </div>
                        </div>
                        <div class="flex items-center gap-2 w-full md:w-auto justify-end">
                            <a href="${ep.link}" target="_blank" class="bg-emerald-600/20 text-emerald-400 px-3 py-2 rounded-xl text-sm hover:bg-emerald-600/30 transition"><i class="fa-solid fa-download ml-1"></i> دانلود</a>
                            <button onclick="editEpisode('${epKey}')" class="bg-slate-700 hover:bg-slate-600 p-2 rounded-xl text-amber-400 transition"><i class="fa-solid fa-pen"></i></button>
                            <button onclick="deleteEpisode('${epKey}')" class="bg-slate-700 hover:bg-slate-600 p-2 rounded-xl text-rose-400 transition"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    </div>
                `;
            }
        }

        function openEpisodeModal(epKey = null) {
            document.getElementById('episode-modal').classList.remove('hidden');
            document.getElementById('episode-modal').classList.add('flex');
            
            if (epKey) {
                document.getElementById('episode-modal-title').innerText = 'ویرایش قسمت';
                document.getElementById('episode-id').value = epKey;
                const ep = serialsData[currentActiveSerialId].episodes[epKey];
                document.getElementById('ep-number').value = ep.number;
                document.getElementById('ep-name').value = ep.name;
                document.getElementById('ep-size-480').value = ep.sizes['480'] || '';
                document.getElementById('ep-size-720').value = ep.sizes['720'] || '';
                document.getElementById('ep-size-1080').value = ep.sizes['1080'] || '';
                document.getElementById('ep-link').value = ep.link;
            } else {
                document.getElementById('episode-modal-title').innerText = 'افزودن قسمت جدید';
                document.getElementById('episode-form').reset();
                document.getElementById('episode-id').value = '';
            }
        }

        function closeEpisodeModal() {
            document.getElementById('episode-modal').classList.remove('flex');
            document.getElementById('episode-modal').classList.add('hidden');
        }

        async function handleEpisodeSubmit(e) {
            e.preventDefault();
            const epKey = document.getElementById('episode-id').value;
            const number = document.getElementById('ep-number').value;
            const name = document.getElementById('ep-name').value;
            const link = document.getElementById('ep-link').value;
            
            const sizes = {
                '480': document.getElementById('ep-size-480').value,
                '720': document.getElementById('ep-size-720').value,
                '1080': document.getElementById('ep-size-1080').value
            };

            const submitBtn = document.getElementById('episode-submit-btn');
            submitBtn.innerText = 'در حال پردازش...';
            submitBtn.disabled = true;

            try {
                let imageUrl = epKey ? serialsData[currentActiveSerialId].episodes[epKey].image : '';
                const fileInput = document.getElementById('ep-image');
                if (fileInput.files.length > 0) {
                    imageUrl = await uploadImageToImgBB('ep-image');
                }

                const payload = { number, name, link, sizes, image: imageUrl };
                const method = epKey ? 'PATCH' : 'POST';
                const endpoint = epKey 
                    ? `/api/firebase?path=serials/${currentActiveSerialId}/episodes/${epKey}.json` 
                    : `/api/firebase?path=serials/${currentActiveSerialId}/episodes.json`;

                await fetch(endpoint, {
                    method: method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                closeEpisodeModal();
                // بروزرسانی داده‌های محلی
                await fetchSerials();
                openSerialEpisodes(currentActiveSerialId);
            } catch (err) {
                alert('خطا: ' + err.message);
            } finally {
                submitBtn.innerText = 'ذخیره';
                submitBtn.disabled = false;
            }
        }

        function editEpisode(epKey) { openEpisodeModal(epKey); }

        async function deleteEpisode(epKey) {
            if (confirm('آیا از حذف این قسمت مطمئن هستید؟')) {
                await fetch(`/api/firebase?path=serials/${currentActiveSerialId}/episodes/${epKey}.json`, { method: 'DELETE' });
                await fetchSerials();
                openSerialEpisodes(currentActiveSerialId);
            }
        }

        // بارگذاری اولیه
        fetchSerials();
    </script>
</body>
</html>
